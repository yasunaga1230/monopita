name: Daily Article Generation

on:
  schedule:
    # JST 11:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generate-article.ts

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name monopita --branch main --commit-message "Daily article $(date +%Y-%m-%d)"

      - name: Commit and push new article
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/content/posts/ frontend/public/images/posts/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "Add daily article $(date +%Y-%m-%d)"
            git push origin main
          fi
